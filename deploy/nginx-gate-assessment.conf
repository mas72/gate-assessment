# Dedicated vhost — do not replace the nginx default site.
# TLS files are filled in by certbot, or by deploy/install-nginx-tls.sh
# after a Let's Encrypt cert exists.

server {
	listen 80;
	listen [::]:80;
	server_name gate-assessment.apk-group.net;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name gate-assessment.apk-group.net;

	ssl_certificate /etc/letsencrypt/live/gate-assessment.apk-group.net/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/gate-assessment.apk-group.net/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	client_max_body_size 4m;

	location / {
		proxy_pass http://127.0.0.1:3001;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-Host $host;
	}
}
